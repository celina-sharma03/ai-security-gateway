[project]
name = "ai-security-gateway"
version = "0.1.0"
description = "A self-hosted proxy that redacts secrets and blocks prompt attacks before they reach an LLM provider."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Any `async def` test just runs. The alternative, "strict", needs an
# @pytest.mark.asyncio on every one of them -- more explicit, and one more
# thing to forget.

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
