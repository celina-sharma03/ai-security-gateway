# Holdout cases, written independently of the tuned evaluation set.
#
# These are graded, never tuned against. They were recorded and run before any
# detection code was changed in response to them, so the score they produce is
# an honest measurement of messages nobody designed the gateway around.
#
# One file, positives and negatives mixed. A case with `expect` must be caught;
# a case without it must pass through untouched.
#
# Typos and odd spacing are kept on purpose. Real messages have them.

cases:

  - text: "My ransaction shows a error code of 81 with my transaction ID as 47366576968999 and RRN as 67900548767098, how can I resolve it"
    note: "Transaction ID and RRN are references, not personal data. Neither can
           move money or identify a person without the bank's own systems, and
           redacting them would break one of the most common support questions
           there is -- the AI needs the reference to help."

  - text: "My order as 7688 7836 4843 has been delayed and need to track it."
    note: "an order number"

  - text: "I'm not able to fill the form due to my aadhar card.it's failing, 7234 0089 8765"
    expect: aadhaar

  - text: "I need to send a mail to an HR and this is my celina.test66@gmail.com"
    expect: email
    note: "address is invented"

  - text: "I need to make a payment with my upi id: 7896543234@ybl,please tell me the steps to do it"
    expect: upi_id
    note: "UPI IDs are how most payments in India are made, and they often
           contain the person's mobile number"

  # ─── Batch 2: UPI ─────────────────────────────────────────────────────
  # Written after UPI detection was built. Masked values are deliberately not
  # caught: the person has already hidden what matters, and what is left
  # can't identify anyone.

  - text: "my transaction with this UPI ID: 6789445390@ybl is failing,what can be the cause?"
    expect: upi_id

  - text: "what can be the steps to pay someone on their UPI ID with 78966*****@ibl"
    note: "masked by the person. The @ibl tells the AI the app is PhonePe, which
           it needs to explain the steps, and redacting it would protect nothing."

  - text: "how can i search for my upi id on specific UPI payment app my number is this 789678**** and my bank is sbi"
    note: "masked phone number, already hidden by the person"

  - text: "is this upi is valid CELINA@AXIS"
    expect: upi_id

  - text: "Could it be a network issue if y upi is failing or any ither cause, as upi payment failed with upi 3456789@ixl and ref is 9876543765"
    expect: upi_id
    note: "two things at once: the UPI ID must be caught, and the ref must be left
           alone -- it is a reference number, the same call as the RRN in batch 1"
