# Things the gateway MUST catch.
#
# Everything here is synthetic. Card numbers are the published test numbers
# that payment processors provide for exactly this purpose — they pass the
# Luhn checksum but belong to nobody. API keys are documentation examples.
# Names, emails and phone numbers are invented.
#
# Each case says what it contains and, where the text isn't the whole story,
# why it's here.

cases:

  # ─── Credit cards ────────────────────────────────────────────────────
  # Published test numbers. All pass Luhn.

  - text: "my card is 4111 1111 1111 1111"
    expect: credit_card
    note: "Visa, space-separated — the most common way people paste one"

  - text: "card: 4111111111111111"
    expect: credit_card
    note: "no separators"

  - text: "use 4111-1111-1111-1111 for the payment"
    expect: credit_card
    note: "dash-separated"

  - text: "charge it to 5500 0000 0000 0004"
    expect: credit_card
    note: "Mastercard"

  - text: "amex 3782 822463 10005"
    expect: credit_card
    note: "American Express — 15 digits, not 16, and grouped 4-6-5"

  - text: "6011 1111 1111 1117 is the card on file"
    expect: credit_card
    note: "Discover"

  - text: "new card 2223 0031 2200 3222"
    expect: credit_card
    note: "Mastercard 2-series (2221-2720), issued since 2017. Published test
           number. The first version of the prefix rule missed it entirely."

  - text: "paying with 8150 0000 0000 1231"
    expect: credit_card
    note: "RuPay, India's own card network, in the 81 range. Synthetic, built to
           pass Luhn. Also missed by the first version of the prefix rule."

  - text: "Here's the config: card=4111111111111111, exp=12/28, cvv=123"
    expect: credit_card
    note: "buried in a config-looking string alongside other fields"

  # ─── API keys and secrets ────────────────────────────────────────────
  # Documentation examples and clearly-fake values.

  - text: "my openai key is sk-proj-not-a-real-key-00000000000000000000"
    expect: api_key
    note: "OpenAI project key prefix"

  - text: "OPENAI_API_KEY=sk-not-a-real-key-0000000000000000000000000"
    expect: api_key
    note: "classic OpenAI prefix, in env-var form"

  - text: "anthropic: sk-ant-api03-not-a-real-key-000000000000000"
    expect: api_key
    note: "Anthropic prefix"

  - text: "aws key AKIAIOSFODNN7EXAMPLE"
    expect: api_key
    note: "AWS's own documented example access key ID"

  - text: "AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
    expect: api_key
    note: "AWS's documented example secret — no fixed prefix, harder to spot"

  - text: "token: ghp_notarealkey00000000000000000000000"
    expect: api_key
    note: "GitHub personal access token"

  - text: "slack webhook uses xoxb-000000000000-000000000000-notarealkey"
    expect: api_key
    note: "Slack bot token"

  - text: "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.abc123"
    expect: api_key
    note: "JWT in an auth header"

  - text: "the private key starts -----BEGIN RSA PRIVATE KEY-----"
    expect: api_key
    note: "PEM header — the block itself may be long, the header is the tell"

  - text: "db password is hunter2, host is localhost"
    expect: password
    note: "password in an otherwise ordinary sentence — the classic accident"

  # ─── Email addresses ─────────────────────────────────────────────────

  - text: "email me at priya.sharma@example.com"
    expect: email
    note: "plain"

  - text: "send it to first.last+invoices@sub.domain.co.in"
    expect: email
    note: "plus-addressing, subdomain, two-part TLD"

  - text: "contact: RAHUL.VERMA@EXAMPLE.CO.IN"
    expect: email
    note: "uppercase"

  - text: "cc priya@example.com and rahul@example.com on the thread"
    expect: email
    note: "two in one message — both must be caught, not just the first"

  # ─── UPI IDs ─────────────────────────────────────────────────────────
  # name@handle, with no dot in the handle. That missing dot is what
  # separates a UPI ID from an email. Added after the independent holdout
  # showed none were being caught.

  - text: "pay me at ravi@ybl"
    expect: upi_id
    note: "known handle (PhonePe), no other clue needed"

  - text: "my upi is ravi@newbank"
    expect: upi_id
    note: "unrecognised handle, caught only because 'upi' is nearby"

  - text: "vpa: shop.kiran@okhdfcbank"
    expect: upi_id
    note: "'vpa' is the official name for a UPI ID, and the name part has a dot"

  - text: "send to RAVI@OKAXIS"
    expect: upi_id
    note: "uppercase"

  - text: "upi id 9812345678@ybl, thanks"
    expect: upi_id
    note: "a mobile number as the name, with a comma straight after"

  - text: "upi://pay?pa=ravi@ybl&pn=Ravi"
    expect: upi_id
    note: "a UPI payment link, the kind encoded inside QR codes"

  - text: "my number and upi: 9812345678@paytm"
    expect: upi_id
    note: "the phone pattern also matches the digits; the longer UPI match must win"

  - text: "Celina@AXIS?"
    expect: upi_id
    note: "no 'upi' word, and @axis isn't a real handle -- but the handle names a
           bank, and the person clearly meant it as their UPI ID"

  - text: "send it to kiran@hdfcpay"
    expect: upi_id
    note: "unrecognised handle that names a bank, no 'upi' word"

  - text: "send 200 to 9123456780@newbank"
    expect: upi_id
    note: "unknown handle and no 'upi' word, but the name is a 10-digit mobile
           number -- almost nothing else is written that way"

  - text: "pay 100 to meena@axisb"
    expect: upi_id
    note: "@axisb is the BHIM Axis Pay handle"

  - text: "shop payments go to kirana.store@okbizaxis"
    expect: upi_id
    note: "@okbizaxis is Google Pay for business"

  # ─── Everyday spellings of the words detection relies on ─────────────
  # Phone, Aadhaar, PAN, and UPI IDs with an unknown handle all need a nearby
  # word. These are the ways people actually write those words.

  - text: "adhaar card no is 3456 7890 1234"
    expect: aadhaar
    note: "'adhaar' -- one of the most common spellings in India"

  - text: "adhar 4567 8901 2345"
    expect: aadhaar
    note: "'adhar'"

  - text: "mob: 9876543210"
    expect: phone
    note: "'mob', short for mobile"

  - text: "mob no 9123456780"
    expect: phone

  - text: "watsapp 9876543210 anytime"
    expect: phone
    note: "'watsapp' -- a common spelling of WhatsApp"

  - text: "whatsap me on 9123456780"
    expect: phone

  - text: "pancard ABCPE1234F"
    expect: pan
    note: "'pancard' written as one word"

  - text: "phonepe id ravi@newbank"
    expect: upi_id
    note: "unknown handle, but the payment app is named"

  - text: "gpay id kiran@newbank"
    expect: upi_id

  - text: "google pay: meena@newbank"
    expect: upi_id

  # ─── Phone numbers ───────────────────────────────────────────────────

  - text: "call me on +91 98765 43210"
    expect: phone
    note: "Indian mobile, country code, spaced"

  - text: "my number is 9876543210"
    expect: phone
    note: "Indian mobile, bare 10 digits starting with 9"

  - text: "reach him at +91-98765-43210"
    expect: phone
    note: "dash-separated"

  - text: "office line +1 (555) 123-4567"
    expect: phone
    note: "US format with parentheses"

  - text: "WhatsApp: 08765432109"
    expect: phone
    note: "leading zero, as often written in India"

  - text: "he called from 9876543210 yesterday"
    expect: phone
    note: "'called', not 'call'. Whole-word matching missed this until the
           context words were allowed to carry the endings people write."

  - text: "contacted on 9876543210 about the refund"
    expect: phone
    note: "'contacted', not 'contact'"

  # ─── Aadhaar ─────────────────────────────────────────────────────────
  # Synthetic. Real Aadhaar numbers carry a Verhoeff checksum; whether to
  # validate it is a Phase 2 decision, same question as Luhn for cards.

  - text: "aadhaar 2345 6789 0123"
    expect: aadhaar
    note: "spaced in groups of four, the printed format"

  - text: "his aadhar number is 234567890123"
    expect: aadhaar
    note: "unspaced, and spelled the common alternative way"

  # ─── PAN ─────────────────────────────────────────────────────────────

  - text: "PAN: ABCPE1234F"
    expect: pan
    note: "five letters, four digits, one letter. The 4th character must be a
           real holder-type code -- P for an individual here. ABCDE1234F, which
           this case used to be, is structurally impossible as a PAN."

  - text: "pan card number abcpe1234f"
    expect: pan
    note: "lowercase"

  - text: "my permanent account number is AAACP1234H"
    expect: pan
    note: "spelled out rather than abbreviated -- C is a company"

  # ─── IP addresses ────────────────────────────────────────────────────
  # Personal data under GDPR when it identifies a person.

  - text: "the user connected from 203.0.113.42"
    expect: ip_address
    note: "IPv4, from the documentation range"

  - text: "client ip 2001:0db8:85a3:0000:0000:8a2e:0370:7334"
    expect: ip_address
    note: "IPv6"

  # ─── Several at once ─────────────────────────────────────────────────
  # The realistic case: someone pastes a whole block.

  - text: |
      Can you help me debug this?
      DB_HOST=localhost
      DB_PASSWORD=hunter2
      STRIPE_KEY=sk-not-a-real-key-0000000000000000000000000
      ADMIN_EMAIL=ops@example.com
    expect_any_of: [password, api_key, email]
    note: "a pasted .env file — the single most common real-world leak"

  - text: "Customer Priya Sharma, priya@example.com, +91 98765 43210, card 4111 1111 1111 1111 — refund please"
    expect_any_of: [email, phone, credit_card]
    note: "a support ticket with everything in one line"
