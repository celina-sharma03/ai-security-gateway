# One command to run it: docker compose up

services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Starts in shadow mode: checks everything, changes nothing.
      # Switch to "enforce" once you've read a week of logs.
      GATEWAY_MODE: shadow
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8080
      GATEWAY_UPSTREAM_BASE_URL: https://api.openai.com/v1
    volumes:
      # Rules are editable without rebuilding the image.
      - ./gateway/config/rules.yaml:/app/gateway/config/rules.yaml:ro
